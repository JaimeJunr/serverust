# Configuração do release-plz (https://release-plz.dev).
#
# release-plz roda em CI (.github/workflows/release-plz.yml) e:
#   1. Compara local com crates.io para descobrir o que precisa de release
#   2. Abre Release PR com bump de versão + CHANGELOG atualizado + tag annotation
#   3. Quando o Release PR é mergeado, dispara cargo publish + git tag + GitHub Release
#
# Versão ÚNICA do workspace (`version.workspace = true` nos crates, tag `vX.Y.Z`),
# que é como o projeto de fato versiona — ver release-checklist.md. Todos os
# crates publicáveis ficam no mesmo `version_group`, e só o `serverust-core`
# cria a tag e o GitHub Release (receita "single tag" do release-plz).
# CHANGELOG: gerado por git-cliff (config em cliff.toml).
# Breaking changes: detectadas por cargo-semver-checks integrado.

[workspace]
# O CHANGELOG.md deste repo é curado à mão (Keep a Changelog, com seção de
# migração por release). git-cliff geraria uma linha por commit, perdendo a
# explicação das mudanças de comportamento — que é o que importa pra quem roda
# em produção. release-plz cuida de versão, tag e publish; o texto é nosso.
changelog_update = false

# Conventional Commits opcionais — release-plz usa para bump automático
# (feat = minor, fix = patch, feat!/BREAKING CHANGE = major).
changelog_config = "cliff.toml"

# Falha fechado: `release` só publica quando o commit vem de uma Release PR
# mergeada. Com o default (true), qualquer crate cuja versão local não está no
# crates.io é publicado direto — em 2026-09-22 o job tentou publicar o
# `serverust-auth` sem PR nenhuma e só não publicou porque não compilou.
release_always = false

# Habilita cargo-semver-checks para detectar breaking changes em código que
# o autor marcou como `fix:` sem `!:` — protege contra patch release acidental.
semver_check = true

# Tag e GitHub Release desligados no workspace e ligados só no crate âncora
# (serverust-core), senão cada crate tentaria criar a mesma tag `vX.Y.Z`.
git_tag_enable = false
git_release_enable = false
git_release_type = "auto"  # prerelease se versão tem -alpha/-beta/-rc

# Comentário no Release PR explicando o que mudou por crate.
pr_branch_prefix = "release-plz/"
pr_labels = ["release"]
pr_name = "chore: release"

# Atualizações de dependências internas no workspace — bump dependentes quando
# o crate dependente recebe minor/patch (mantém path-deps consistentes).
dependencies_update = true

# Crates publicáveis. Listados explicitamente para evitar publicar examples/
# por engano. release-plz só toca o que está listado.
[[package]]
name = "serverust-macros"
publish = true
publish_features = []
version_group = "workspace"

[[package]]
name = "serverust-core"
publish = true
version_group = "workspace"
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_enable = true

[[package]]
name = "serverust-telemetry"
publish = true
version_group = "workspace"

[[package]]
name = "serverust-events"
publish = true
version_group = "workspace"

[[package]]
name = "serverust-lambda"
publish = true
version_group = "workspace"

[[package]]
name = "serverust-cli"
publish = true
version_group = "workspace"

[[package]]
name = "serverust-auth"
publish = true
version_group = "workspace"

# Crates internas que NÃO devem ser publicadas (examples, baselines, testes).
[[package]]
name = "serverust-macros-tests"
publish = false
release = false

[[package]]
name = "hello-world"
publish = false
release = false

[[package]]
name = "funds-api"
publish = false
release = false

[[package]]
name = "todo-api"
publish = false
release = false

[[package]]
name = "kafka-wallet"
publish = false
release = false
