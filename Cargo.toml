[workspace]
members = [
    "serverust-core",
    "serverust-macros",
    "serverust-cli",
    "serverust-lambda",
    "serverust-telemetry",
    "serverust-events",
    "examples/hello-world",
    "examples/funds-api",
    "examples/todo-api",
    "examples/kafka-wallet",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
authors = ["Jaime Junior <jaimeodairbassojuniorjaime@gmail.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/JaimeJunr/serverust"
homepage = "https://github.com/JaimeJunr/serverust"
documentation = "https://docs.rs/serverust-core"
readme = "README.md"
keywords = ["lambda", "serverless", "aws", "framework", "api"]
categories = ["web-programming", "web-programming::http-server", "asynchronous"]

# Build incremental local mais rápido: debuginfo completo das dependências é o
# grosso do tempo de link e não é usado no dia a dia (backtrace com linha basta).
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = false
