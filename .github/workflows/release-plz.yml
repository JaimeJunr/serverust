name: release-plz

# Trigger APENAS manual. O release-plz.toml está configurado para versionamento
# per-crate (tags `<crate>-vX.Y.Z`), mas o projeto ainda versiona workspace-wide
# (`version.workspace = true` nos 6 crates, tag única `vX.Y.Z`) — as duas coisas
# não se encaixam, e o job disparando em todo push no main só produzia falha.
# O release da v0.4.0 foi feito pelo processo manual de docs/development/release-checklist.md.
# Reative o `push` quando o projeto migrar de fato para per-crate.
on:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz-release:
    name: release-plz / release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install librdkafka build deps
        # release-plz compila o workspace inteiro; serverust-events/kafka puxa
        # librdkafka via cmake, que precisa de curl/curl.h e libsasl2.
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libsasl2-dev libcurl4-openssl-dev
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: release-plz / release-pr
    runs-on: ubuntu-latest
    concurrency:
      # Serializa execuções: uma release-pr por vez na mesma ref. Não cancela a
      # anterior (cancel-in-progress: false) — a que já está rodando termina.
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install librdkafka build deps
        # release-plz compila o workspace inteiro; serverust-events/kafka puxa
        # librdkafka via cmake, que precisa de curl/curl.h e libsasl2.
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libsasl2-dev libcurl4-openssl-dev
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
