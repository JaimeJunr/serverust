name: release-plz

# Trigger APENAS manual. O release-plz.toml agora segue a versão única do
# workspace (tag `vX.Y.Z`) e só publica a partir de Release PR mergeada
# (`release_always = false`), então reativar o `push` é seguro quando quisermos.
#
# RELEASE_PLZ_TOKEN (PAT fine-grained: Contents + Pull requests, read/write)
# é obrigatório. Com o GITHUB_TOKEN o GitHub recusa abrir a PR (403) e, mesmo
# liberando, PR aberta por ele não dispara os checks exigidos pelo main
# (benchmark, lambda-event-compat, kafka-wallet) — a Release PR ficaria travada.
on:
  workflow_dispatch:

permissions:
  pull-requests: write
  contents: write

jobs:
  release-plz-release:
    name: release-plz / release
    runs-on: ubuntu-latest
    steps:
      - name: Exigir RELEASE_PLZ_TOKEN
        # Falha fechado: sem o PAT, não cai silenciosamente no GITHUB_TOKEN.
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLZ_TOKEN" ]; then
            echo "::error::secret RELEASE_PLZ_TOKEN ausente — veja o cabeçalho de .github/workflows/release-plz.yml"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install librdkafka build deps
        # release-plz compila o workspace inteiro; serverust-events/kafka puxa
        # librdkafka via cmake, que precisa de curl/curl.h e libsasl2.
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libsasl2-dev libcurl4-openssl-dev
      - uses: release-plz/action@v0.5
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  release-plz-pr:
    name: release-plz / release-pr
    runs-on: ubuntu-latest
    concurrency:
      # Serializa execuções: uma release-pr por vez na mesma ref. Não cancela a
      # anterior (cancel-in-progress: false) — a que já está rodando termina.
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Exigir RELEASE_PLZ_TOKEN
        # Falha fechado: sem o PAT, não cai silenciosamente no GITHUB_TOKEN.
        env:
          RELEASE_PLZ_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLZ_TOKEN" ]; then
            echo "::error::secret RELEASE_PLZ_TOKEN ausente — veja o cabeçalho de .github/workflows/release-plz.yml"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLZ_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install librdkafka build deps
        # release-plz compila o workspace inteiro; serverust-events/kafka puxa
        # librdkafka via cmake, que precisa de curl/curl.h e libsasl2.
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libsasl2-dev libcurl4-openssl-dev
      - uses: release-plz/action@v0.5
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PLZ_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
