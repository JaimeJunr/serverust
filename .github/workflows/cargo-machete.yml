name: cargo-machete

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "**/Cargo.lock"
      - "**/*.rs"
      - ".github/workflows/cargo-machete.yml"
  schedule:
    # Cron semanal para pegar deps removidas/órfãs no ecossistema.
    - cron: "17 6 * * 1"

jobs:
  machete:
    name: Find unused dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinado em SHA imutável: `@main` é referência flutuante e um commit
      # hostil no repo da action executaria com acesso ao checkout.
      - uses: bnjbvr/cargo-machete@ac30a525c0a8d163a92d727b3ff079ee3f6ecb08 # v0.9.2
