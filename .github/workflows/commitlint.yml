name: commitlint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cog-check:
    name: Conventional Commits (cocogitto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # cog precisa histórico completo
      - name: Install cocogitto
        # cargo-binstall pega binary release oficial direto do GitHub releases.
        # Mais confiável que install.sh (que retornou 404 em 2026-05).
        uses: taiki-e/install-action@v2
        with:
          tool: cocogitto
      - name: Validate commit history
        # Em PR: valida só os commits da PR.
        # Em push para main: `--from-latest-tag` valida a partir da última tag.
        # `cog check` sem flag varre o histórico INTEIRO e reprova em dois
        # commits antigos que não dá para reescrever (já publicados):
        #   76e3a61 "feat(serverust-events 0.3.0): ..." — escopo com espaço
        #   8209786 "release: ..."                      — tipo `release` não permitido
        # Um check permanentemente vermelho no main mascara falha real.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            cog check origin/${{ github.base_ref }}..HEAD
          else
            cog check --from-latest-tag
          fi
