name: commitlint

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  cog-check:
    name: Conventional Commits (cocogitto)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # cog precisa histórico completo
      - name: Install cocogitto
        # cargo-binstall pega binary release oficial direto do GitHub releases.
        # Mais confiável que install.sh (que retornou 404 em 2026-05).
        uses: taiki-e/install-action@v2
        with:
          tool: cocogitto
      - name: Validate commit history
        # Em PR: valida só os commits da PR.
        # Em push para main: valida do último tag até HEAD.
        #
        # `cog check` sem argumento varre o histórico INTEIRO e por isso
        # reprovava SEMPRE no push, por dois commits já publicados que não dá
        # para reescrever: 76e3a61 (escopo com espaço, "serverust-events 0.3.0")
        # e 8209786 (tipo `release`, que não existe no cog.toml). O check ficava
        # permanentemente vermelho no main — e um check sempre vermelho mascara
        # falha real, que foi exatamente a lição dos gates de fmt/clippy.
        #
        # `--from-latest-tag` ancora o range na última tag de release. Os dois
        # commits problemáticos são anteriores à v0.4.0, então saem do range;
        # tudo que entrar no main a partir daí continua sendo validado.
        #
        # Depende de `tag_prefix = "v"` no cog.toml: as tags do repo são vX.Y.Z
        # e, com o valor antigo (""), o cog não reconhecia nenhuma —
        # `--from-latest-tag` falhava com "unable to get any tag" (#34).
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin ${{ github.base_ref }}
            cog check origin/${{ github.base_ref }}..HEAD
          else
            cog check --from-latest-tag
          fi
