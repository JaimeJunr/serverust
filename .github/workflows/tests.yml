name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # A matriz é DERIVADA do workspace, não escrita à mão.
  #
  # Escrita à mão ela era uma allowlist por presença: crate novo que ninguém
  # lembrasse de adicionar não reprovava — sumia. Foi o que aconteceu com o
  # serverust-auth, criado com 65 testes (todos os de default deny entre eles)
  # que nunca rodaram no CI porque faltava uma linha de YAML que nenhum `grep`
  # procura. Os testes de funds-api e todo-api nunca rodaram pelo mesmo motivo.
  #
  # Agora ser testado é consequência de existir no workspace. O que sobrou de
  # decisão humana está em scripts/ci_test_matrix.sh, em duas listas que não
  # conseguem esconder um crate — ver o cabeçalho de lá.
  matriz:
    name: derivar matriz do workspace
    runs-on: ubuntu-latest
    outputs:
      config: ${{ steps.gerar.outputs.config }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - id: gerar
        run: echo "config=$(./scripts/ci_test_matrix.sh)" >> "$GITHUB_OUTPUT"
      - name: Matriz derivada
        run: ./scripts/ci_test_matrix.sh | jq .
      # Sem isto, o gerador poderia voltar a deixar um crate de fora em
      # silêncio — só que agora por um bug no gerador em vez de por esquecimento.
      - name: Guarda da matriz
        run: ./scripts/test_ci_test_matrix.sh

  nextest:
    name: cargo nextest (${{ matrix.crate }} / features=${{ matrix.features }})
    needs: matriz
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Rodamos por crate para isolar falhas e respeitar a regra "nunca workspace
      # build inteiro de uma vez" (CLAUDE.md). nextest é mais rápido por design
      # (parallelism + retry).
      matrix: ${{ fromJSON(needs.matriz.outputs.config) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache key inclui matrix para isolar caches por crate+features.
          shared-key: "tests-${{ matrix.crate }}-${{ matrix.features }}"
      - name: Install librdkafka build deps
        # `kafka` vem derivado das dependências reais do crate, não de uma
        # lista: crate que passar a usar rdkafka amanhã já chega coberto.
        if: matrix.kafka
        # libcurl4-openssl-dev: rdkafka-sys >=4.10 requer curl/curl.h em build.
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libsasl2-dev libcurl4-openssl-dev
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run tests
        env:
          # Vazio para todos, menos onde o gerador marca a exceção. Um crate
          # sem testes que não esteja na lista de exceções reprova por 0
          # testes, em vez de virar verde vazio.
          NO_TESTS: ${{ matrix.no_tests && format('--no-tests={0}', matrix.no_tests) || '' }}
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo nextest run -p ${{ matrix.crate }} $NO_TESTS
          else
            cargo nextest run -p ${{ matrix.crate }} --features "${{ matrix.features }}" $NO_TESTS
          fi
