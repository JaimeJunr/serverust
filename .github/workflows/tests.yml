name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  nextest:
    name: cargo nextest (${{ matrix.crate }} / features=${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Rodamos por crate para isolar falhas e respeitar a regra "nunca workspace
      # build inteiro de uma vez" (CLAUDE.md). nextest é mais rápido por design
      # (parallelism + retry).
      matrix:
        include:
          - crate: serverust-macros
            features: ""
            # Único crate sem teste próprio: é proc-macro puro e os testes dele
            # (trybuild + runtime) vivem em serverust-macros-tests, que não pode
            # ser dev-dep daqui sem recriar o ciclo. Sem isto o nextest sai 4
            # ("no tests to run"). A exceção é marcada aqui de propósito, em vez
            # de `--no-tests=pass` na matriz inteira: assim qualquer OUTRO crate
            # que fique sem teste continua reprovando em vez de virar verde vazio.
            no_tests: "pass"
          - crate: serverust-macros-tests
            features: ""
          - crate: serverust-core
            features: ""
          - crate: serverust-telemetry
            features: ""
          - crate: serverust-events
            features: ""
          - crate: serverust-events
            features: "sqs in-memory"
          - crate: serverust-events
            features: "kafka"
          - crate: serverust-events
            features: "asyncapi sqs"
          - crate: serverust-lambda
            features: ""
          - crate: serverust-cli
            features: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          # Cache key inclui matrix para isolar caches por crate+features.
          shared-key: "tests-${{ matrix.crate }}-${{ matrix.features }}"
      - name: Install librdkafka build deps (kafka feature)
        if: contains(matrix.features, 'kafka')
        # libcurl4-openssl-dev: rdkafka-sys >=4.10 requer curl/curl.h em build.
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential libssl-dev libsasl2-dev libcurl4-openssl-dev
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Run tests
        env:
          # Vazio para todos, menos onde a matriz marca a exceção explicitamente.
          NO_TESTS: ${{ matrix.no_tests && format('--no-tests={0}', matrix.no_tests) || '' }}
        run: |
          if [ -z "${{ matrix.features }}" ]; then
            cargo nextest run -p ${{ matrix.crate }} $NO_TESTS
          else
            cargo nextest run -p ${{ matrix.crate }} --features "${{ matrix.features }}" $NO_TESTS
          fi
