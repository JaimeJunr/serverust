pre-commit:
  parallel: true
  commands:
    fmt:
      run: ./scripts/quality_fmt.sh
    lint:
      run: ./scripts/quality_lint.sh
    complexity:
      run: ./scripts/quality_complexity.sh
    cycles:
      run: ./scripts/quality_cycles.sh
    hello_world:
      run: ./scripts/quality_hello_world.sh
    lefthook_hooks:
      # Guard dos próprios hooks abaixo: garante que ausência da ferramenta
      # continua sendo skip e que reprovação dela volta a bloquear.
      run: ./scripts/test_lefthook_hooks.sh
    machete:
      # Detecta deps não-usadas (cargo-machete). Skip silencioso só se a tool
      # estiver ausente — sem força instalação compulsória. Reprovação da
      # ferramenta (deps não usadas) continua bloqueando o commit.
      run: if command -v cargo-machete >/dev/null 2>&1; then cargo machete; else echo "[skip] cargo-machete ausente (cargo install cargo-machete)"; fi

# Valida commit message contra Conventional Commits via cocogitto (cog.toml).
commit-msg:
  commands:
    cog-verify:
      # Skip silencioso só se cog estiver ausente. Instalação:
      #   curl https://raw.githubusercontent.com/cocogitto/cocogitto/main/install.sh | bash
      run: if command -v cog >/dev/null 2>&1; then cog verify --file {1}; else echo "[skip] cocogitto ausente"; fi

pre-push:
  parallel: false
  commands:
    changelog:
      run: ./scripts/quality_changelog.sh
    coverage:
      run: ./scripts/quality_coverage.sh
    mutation:
      run: ./scripts/quality_mutation.sh
    kpi:
      run: ./scripts/quality_kpi_gate.sh
    metrics_required:
      run: ./scripts/quality_metrics_required.sh
