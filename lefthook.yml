pre-commit:
  parallel: true
  commands:
    fmt:
      run: ./scripts/quality_fmt.sh
    lint:
      run: ./scripts/quality_lint.sh
    complexity:
      run: ./scripts/quality_complexity.sh
    cycles:
      run: ./scripts/quality_cycles.sh
    hello_world:
      run: ./scripts/quality_hello_world.sh
    kpi_metrics_lib:
      # Guard da lógica dos gates de KPI: tolerância, teto absoluto e agregação
      # de amostras. Barato (sem build), roda a cada commit.
      run: ./scripts/test_kpi_metrics_lib.sh
    lefthook_hooks:
      # Guard dos próprios hooks abaixo: garante os três estados — ausência
      # avisa alto (e reprova em CI), reprovação da ferramenta bloqueia.
      run: ./scripts/test_lefthook_hooks.sh
    machete:
      # Detecta deps não-usadas (cargo-machete). Ausência da ferramenta não é
      # mais skip silencioso: avisa alto em stderr e reprova em CI
      # (scripts/lib/tool_guard.sh). Reprovação da ferramenta continua
      # bloqueando o commit.
      run: ./scripts/quality_machete.sh

# Valida commit message contra Conventional Commits via cocogitto (cog.toml).
commit-msg:
  commands:
    cog-verify:
      # Ausência do cog avisa alto em stderr e reprova em CI
      # (scripts/lib/tool_guard.sh), em vez de passar em silêncio.
      run: ./scripts/quality_commit_msg.sh {1}

pre-push:
  parallel: false
  commands:
    changelog:
      run: ./scripts/quality_changelog.sh
    coverage:
      run: ./scripts/quality_coverage.sh
    mutation:
      run: ./scripts/quality_mutation.sh
    kpi:
      run: ./scripts/quality_kpi_gate.sh
    metrics_required:
      run: ./scripts/quality_metrics_required.sh
