[package]
name = "serverust-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Autenticação e autorização opt-in para serverust: verificação stateless de JWT emitido por IdP externo."

[features]
# Descoberta de OIDC e busca do JWKS por HTTP. Opt-in porque arrasta cliente
# HTTP e pilha TLS: quem usa chave estática (`JwtAuth`) ou busca o JWKS com o
# próprio cliente (`JwksAuth::from_jwks_json`) não paga isso em binário nem em
# cold start.
jwks = ["dep:reqwest"]

[dependencies]
# Contrato do default deny: este crate insere `AuthEnabled` e `Authenticated`
# nas extensions para que o `AuthGate` do core saiba decidir. A dependência é
# unidirecional — `serverust-core` nunca importa `serverust-auth`, e é isso que
# mantém o core sem cripto.
serverust-core = { path = "../serverust-core", version = "0.4.2" }
axum = "0.8"
http = "1"
tower = "0.5"
# Future do layer é um enum (caminho rápido / revalidação) e precisa projetar Pin.
pin-project-lite = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
# Só `sync`, para o Mutex assíncrono que serializa as revalidações do JWKS.
# Sem runtime, sem I/O: o `sync` do tokio é Rust puro, e o runtime já está em
# qualquer binário serverust por via do core.
tokio = { version = "1", default-features = false, features = ["sync"] }
# Backend de cripto em Rust puro, por decisão da ADR 0009: a alternativa
# `aws_lc_rs` exige cmake e toolchain C, o que quebra a cross-compilação
# x86_64 -> aarch64 usada no build ARM64 de Lambda.
jsonwebtoken = { version = "11", default-features = false, features = [
    "rust_crypto",
    "use_pem",
] }
# Só com a feature `jwks`. `default-features = false` derruba o TLS nativo (que
# exigiria OpenSSL do sistema) e o resto do default; `rustls-tls-webpki-roots`
# embute as raízes da Mozilla no binário, em vez de depender do repositório de
# certificados do SO — é o que faz a verificação de certificado funcionar no
# container mínimo da Lambda sem configuração.
reqwest = { version = "0.12", optional = true, default-features = false, features = [
    "rustls-tls-webpki-roots",
    "http2",
] }

[dev-dependencies]
# Integration tests não herdam `[dependencies]`: os testes precisam EMITIR
# tokens, então `jsonwebtoken` é repetido aqui com exatamente as mesmas
# features declaradas acima — divergir de features aqui mudaria o backend de
# cripto sob teste.
jsonwebtoken = { version = "11", default-features = false, features = [
    "rust_crypto",
    "use_pem",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
serverust-macros = { path = "../serverust-macros", version = "0.4.2" }
# Necessária para montar uma `Route` pública à mão no teste de ponta a ponta:
# `Route::new` recebe uma `utoipa::openapi::path::Operation`. Sai quando a
# macro `#[public]` existir e cobrir esse caso.
utoipa = "5"
# Servidor de IdP falso nos testes de JWKS: os testes sobem um axum local que
# serve o documento de descoberta e o JWKS, para exercitar o caminho HTTP real
# em vez de um dublê do cliente.
axum = "0.8"
serde_json = "1"

# Sem isto, a API de JWKS não apareceria no docs.rs: a feature é opt-in, e o
# docs.rs constrói com as features default.
[package.metadata.docs.rs]
all-features = true
